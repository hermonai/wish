[package]
name = "wish-render"
authors = ["Hermon AI <support@hermon.ai>"]
version = "0.1.0"
edition = "2021"
description = "Native canvas renderer for Wish v0.5.0. Real OS window + GPU rendering via eframe/wgpu — no browser."
publish.workspace = true
license.workspace = true

[dependencies]
log.workspace = true
wish-canvas-core.workspace = true
wish-world-model.workspace = true
wish-world-studio.workspace = true
wish-provenance.workspace = true

# eframe pulls in winit + wgpu/glow + egui. We pin to its 0.29 line and
# use the wgpu backend so the rendering path is GPU. eframe carries its
# own wgpu copy that is *independent* from the workspace's wgpu 29.0.1
# (the desktop app's WishUI uses that); Cargo allows multiple
# semver-incompatible wgpu versions in a single build.
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.29"
