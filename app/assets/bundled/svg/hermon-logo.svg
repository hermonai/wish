<!--
  Hermon mark: a stylized "H" with two rounded pillars and a thick
  horizontal beam. Fill spec matches `wish-logo-neutral.svg` so the
  Icon rendering pipeline applies the active theme color (passed via
  `Icon::new("..", logo_fill)` in `about_page.rs`) consistently.
  The shape reads as an "H" at every size from 16px (dock badge) to
  92px (about page), and is clearly distinct from the W silhouette
  inherited from the upstream brand.
-->
